name: Weekly retrain with evaluation gate

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    # The final step pushes models/active.pkl back to the repo. The default
    # GITHUB_TOKEN is read-only, so without this the push fails with 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # src.train exits 1 when the gate rejects the candidate. That is a
      # successful outcome, not a failure, so we catch it deliberately.
      - name: Train and evaluate
        id: train
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python -m src.train
          code=$?
          set -e
          if [ $code -eq 1 ]; then
            echo "promoted=false" >> $GITHUB_OUTPUT
            echo "Candidate rejected by the gate. Active model unchanged."
            exit 0
          elif [ $code -ne 0 ]; then
            exit $code
          fi
          echo "promoted=true" >> $GITHUB_OUTPUT

      - name: Commit the promoted model
        if: steps.train.outputs.promoted == 'true'
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f models/active.pkl
          git commit -m "Promote retrained model"
          git push
